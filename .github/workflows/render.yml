name: Render trailer
on:
  workflow_dispatch:
jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: anime-reverie-trailer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 libasound2t64
      - run: npm install
      - name: Render chunk
        run: |
          START=$(( ${{ matrix.part }} * 400 ))
          END=$(( START + 399 ))
          npx remotion render src/index.ts Trailer out/part${{ matrix.part }}.mp4 --frames=$START-$END --muted --gl=swangle --timeout=240000
      - uses: actions/upload-artifact@v4
        with:
          name: part${{ matrix.part }}
          path: anime-reverie-trailer/out/part${{ matrix.part }}.mp4
  join:
    needs: chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: part*
          merge-multiple: true
      - name: Join and add audio
        run: |
          for i in 0 1 2 3 4 5; do echo "file 'parts/part$i.mp4'" >> list.txt; done
          ffmpeg -y -f concat -safe 0 -i list.txt -i anime-reverie-trailer/public/audio/reverie-score.wav -c:v copy -c:a aac -b:a 192k -af "afade=t=in:d=1.5,afade=t=out:st=77.5:d=2.5" -shortest anime-reverie-trailer.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: anime-reverie-trailer
          path: anime-reverie-trailer.mp4
