name: Render trailer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: anime-reverie-trailer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 libasound2t64
      - run: npm install
      - run: npx remotion render src/index.ts Trailer out/anime-reverie-trailer.mp4 --gl=swangle
      - uses: actions/upload-artifact@v4
        with:
          name: anime-reverie-trailer
          path: anime-reverie-trailer/out/anime-reverie-trailer.mp4
